<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 880" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">LRU cache operation and eviction example</title>
  <desc id="desc">Verified example from the report: with cache state 1, 2, 99, 98, a request for 97 misses and evicts 99 because it has the oldest timestamp.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .ttl { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:24px; font-weight:700; fill:#0f172a; }
      .sub { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:15px; fill:#475569; }
      .lab { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:16px; font-weight:700; fill:#334155; }
      .slot { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; }
      .val { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:18px; font-weight:700; fill:#0f172a; }
      .time { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:13px; fill:#64748b; }
      .lru { fill:#fff1f2; stroke:#e11d48; stroke-width:2.5; }
      .new { fill:#ecfdf5; stroke:#059669; stroke-width:2.5; }
      .hit { fill:#eff6ff; stroke:#2563eb; stroke-width:1.5; }
      .miss { fill:#fff7ed; stroke:#d97706; stroke-width:1.5; }
      .chip { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; font-weight:700; }
      .ln { stroke:#475569; stroke-width:2; fill:none; marker-end:url(#arrow2); }
      .note { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; fill:#0f172a; }
      .redlab { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:16px; font-weight:700; fill:#be123c; }
      .greenlab { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:16px; font-weight:700; fill:#047857; }
    </style>
  </defs>

  <rect width="1100" height="880" fill="#ffffff"/>
  <text class="ttl" x="40" y="48">LRU cache operation — verified eviction example</text>
  <text class="sub" x="40" y="76">Four-slot cache; timestamps come from the global logical clock in the report</text>

  <!-- request trace -->
  <text class="lab" x="40" y="122">Access trace (first 9 requests)</text>
  <g transform="translate(40,138)">
    <rect class="miss" x="0" y="0" width="70" height="42" rx="8"/><text class="chip" x="35" y="27" text-anchor="middle" fill="#9a3412">1 · M</text>
    <rect class="miss" x="80" y="0" width="70" height="42" rx="8"/><text class="chip" x="115" y="27" text-anchor="middle" fill="#9a3412">2 · M</text>
    <rect class="miss" x="160" y="0" width="70" height="42" rx="8"/><text class="chip" x="195" y="27" text-anchor="middle" fill="#9a3412">99 · M</text>
    <rect class="hit" x="240" y="0" width="70" height="42" rx="8"/><text class="chip" x="275" y="27" text-anchor="middle" fill="#1e40af">1 · H</text>
    <rect class="hit" x="320" y="0" width="70" height="42" rx="8"/><text class="chip" x="355" y="27" text-anchor="middle" fill="#1e40af">2 · H</text>
    <rect class="miss" x="400" y="0" width="70" height="42" rx="8"/><text class="chip" x="435" y="27" text-anchor="middle" fill="#9a3412">98 · M</text>
    <rect class="hit" x="480" y="0" width="70" height="42" rx="8"/><text class="chip" x="515" y="27" text-anchor="middle" fill="#1e40af">1 · H</text>
    <rect class="hit" x="560" y="0" width="70" height="42" rx="8"/><text class="chip" x="595" y="27" text-anchor="middle" fill="#1e40af">2 · H</text>
    <rect class="miss" x="640" y="0" width="70" height="42" rx="8"/><text class="chip" x="675" y="27" text-anchor="middle" fill="#9a3412">97 · M</text>
    <text class="sub" x="730" y="28">H = hit (refresh recency) · M = miss (insert or evict)</text>
  </g>

  <!-- before state -->
  <text class="lab" x="40" y="232">Before request 97 (clock = 8)</text>
  <g transform="translate(40,248)">
    <rect class="slot" x="0" y="0" width="220" height="96" rx="10"/>
    <text class="val" x="110" y="42" text-anchor="middle">1</text><text class="time" x="110" y="68" text-anchor="middle">time = 7</text>
    <rect class="slot" x="236" y="0" width="220" height="96" rx="10"/>
    <text class="val" x="346" y="42" text-anchor="middle">2</text><text class="time" x="346" y="68" text-anchor="middle">time = 8</text>
    <rect class="lru" x="472" y="0" width="220" height="96" rx="10"/>
    <text class="val" x="582" y="42" text-anchor="middle">99</text><text class="time" x="582" y="68" text-anchor="middle">time = 3 · oldest</text>
    <rect class="slot" x="708" y="0" width="220" height="96" rx="10"/>
    <text class="val" x="818" y="42" text-anchor="middle">98</text><text class="time" x="818" y="68" text-anchor="middle">time = 6</text>
    <text class="redlab" x="582" y="124" text-anchor="middle">Least recently used entry</text>
  </g>

  <path class="ln" d="M550 370 L550 420"/>
  <rect x="300" y="422" width="500" height="62" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text class="lab" x="550" y="447" text-anchor="middle">Request 97 → MISS; no empty slot</text>
  <text class="note" x="550" y="470" text-anchor="middle">evictOldest() selects the smallest timestamp: 99 (T3)</text>

  <path class="ln" d="M550 484 L550 530"/>

  <!-- after state -->
  <text class="lab" x="40" y="566">After insertion (clock = 9)</text>
  <g transform="translate(40,582)">
    <rect class="slot" x="0" y="0" width="220" height="96" rx="10"/>
    <text class="val" x="110" y="42" text-anchor="middle">1</text><text class="time" x="110" y="68" text-anchor="middle">time = 7</text>
    <rect class="slot" x="236" y="0" width="220" height="96" rx="10"/>
    <text class="val" x="346" y="42" text-anchor="middle">2</text><text class="time" x="346" y="68" text-anchor="middle">time = 8</text>
    <rect class="new" x="472" y="0" width="220" height="96" rx="10"/>
    <text class="val" x="582" y="42" text-anchor="middle">97</text><text class="time" x="582" y="68" text-anchor="middle">time = 9 · new</text>
    <rect class="slot" x="708" y="0" width="220" height="96" rx="10"/>
    <text class="val" x="818" y="42" text-anchor="middle">98</text><text class="time" x="818" y="68" text-anchor="middle">time = 6</text>
    <text class="greenlab" x="582" y="124" text-anchor="middle">Newly inserted entry</text>
  </g>

  <text class="lab" x="40" y="740">Verified result after all 11 requests</text>
  <rect x="40" y="756" width="1020" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text class="note" x="60" y="783">11 requests · 6 hits · 5 misses · final cache {1, 2, 97, 98}</text>
  <text class="note" x="60" y="809">The frequently accessed working set {1, 2} remained in the cache.</text>

  <text class="sub" x="40" y="862">This is the exact trace produced by the code listing in the published report.</text>
</svg>
