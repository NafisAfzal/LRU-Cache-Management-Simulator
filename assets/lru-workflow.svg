<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">LRU cache simulation workflow</title>
  <desc id="desc">Flowchart of the verified simulation: requests are processed one at a time, hits refresh recency, misses insert or evict the least recently used entry, and final statistics are reported.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; rx:10; }
      .start { fill:#eff6ff; stroke:#2563eb; stroke-width:2; rx:10; }
      .hit { fill:#ecfdf5; stroke:#0d9488; stroke-width:2; rx:10; }
      .miss { fill:#fff7ed; stroke:#d97706; stroke-width:2; rx:10; }
      .decision { fill:#f1f5f9; stroke:#475569; stroke-width:2; }
      .end { fill:#eef2ff; stroke:#4f46e5; stroke-width:2; rx:10; }
      .t { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:17px; fill:#0f172a; }
      .ts { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; fill:#475569; }
      .lbl { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; font-weight:600; fill:#334155; }
      .ln { stroke:#475569; stroke-width:2; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1000" height="1320" fill="#ffffff"/>

  <rect class="start" x="300" y="30" width="400" height="64"/>
  <text class="t" x="500" y="58" text-anchor="middle" font-weight="700">Input access requests</text>
  <text class="ts" x="500" y="80" text-anchor="middle">{1, 2, 99, 1, 2, 98, 1, 2, 97, 1, 2}</text>
  <path class="ln" d="M500 94 L500 130"/>

  <rect class="box" x="270" y="132" width="460" height="78"/>
  <text class="t" x="500" y="161" text-anchor="middle" font-weight="600">Initialize cache</text>
  <text class="ts" x="500" y="185" text-anchor="middle">4 slots: valid = false, tag = -1, time = 0</text>
  <text class="ts" x="500" y="203" text-anchor="middle">globalClock = 0; hits = 0; misses = 0</text>
  <path class="ln" d="M500 210 L500 246"/>

  <rect class="box" x="300" y="248" width="400" height="62"/>
  <text class="t" x="500" y="276" text-anchor="middle" font-weight="600">Process one request</text>
  <text class="ts" x="500" y="298" text-anchor="middle">globalClock++ (logical timestamp)</text>
  <path class="ln" d="M500 310 L500 342"/>

  <polygon class="decision" points="500,344 690,410 500,476 310,410"/>
  <text class="t" x="500" y="404" text-anchor="middle" font-weight="600">Tag found</text>
  <text class="t" x="500" y="426" text-anchor="middle" font-weight="600">in cache?</text>

  <!-- Hit branch -->
  <path class="ln" d="M310 410 L200 410 L200 500"/>
  <text class="lbl" x="248" y="398" text-anchor="middle">HIT</text>
  <rect class="hit" x="70" y="502" width="260" height="84"/>
  <text class="t" x="200" y="530" text-anchor="middle" font-weight="700">Refresh recency</text>
  <text class="ts" x="200" y="553" text-anchor="middle">cache[i].time = globalClock</text>
  <text class="ts" x="200" y="573" text-anchor="middle">hits++</text>
  <path class="ln" d="M200 586 L200 720 L430 720"/>

  <!-- Miss branch -->
  <path class="ln" d="M690 410 L800 410 L800 500"/>
  <text class="lbl" x="752" y="398" text-anchor="middle">MISS</text>
  <rect class="miss" x="670" y="502" width="260" height="84"/>
  <text class="t" x="800" y="530" text-anchor="middle" font-weight="700">addToCache(request)</text>
  <text class="ts" x="800" y="553" text-anchor="middle">misses++</text>
  <text class="ts" x="800" y="573" text-anchor="middle">find a slot or evict</text>
  <path class="ln" d="M800 586 L800 618"/>

  <polygon class="decision" points="800,620 930,672 800,724 670,672"/>
  <text class="t" x="800" y="668" text-anchor="middle" font-weight="600">Empty</text>
  <text class="t" x="800" y="690" text-anchor="middle" font-weight="600">slot?</text>

  <path class="ln" d="M670 672 L600 672 L600 720 L570 720"/>
  <text class="lbl" x="628" y="660" text-anchor="middle">YES</text>
  <rect class="miss" x="430" y="690" width="140" height="60"/>
  <text class="ts" x="500" y="714" text-anchor="middle">Insert tag</text>
  <text class="ts" x="500" y="734" text-anchor="middle">+ timestamp</text>

  <path class="ln" d="M930 672 L960 672 L960 760 L840 760"/>
  <text class="lbl" x="948" y="660" text-anchor="middle">NO</text>
  <rect class="miss" x="640" y="732" width="200" height="80"/>
  <text class="ts" x="740" y="756" text-anchor="middle">evictOldest(): replace</text>
  <text class="ts" x="740" y="778" text-anchor="middle">smallest timestamp</text>
  <text class="ts" x="740" y="798" text-anchor="middle">with new tag</text>
  <path class="ln" d="M740 812 L740 850 L540 850 L540 900"/>

  <path class="ln" d="M500 750 L500 900"/>

  <rect class="box" x="330" y="902" width="340" height="62"/>
  <text class="t" x="500" y="930" text-anchor="middle" font-weight="600">printCacheState()</text>
  <text class="ts" x="500" y="952" text-anchor="middle">show each slot and timestamp</text>
  <path class="ln" d="M500 964 L500 996"/>

  <polygon class="decision" points="500,998 620,1046 500,1094 380,1046"/>
  <text class="t" x="500" y="1042" text-anchor="middle" font-weight="600">More</text>
  <text class="t" x="500" y="1064" text-anchor="middle" font-weight="600">requests?</text>

  <path class="ln" d="M380 1046 L250 1046 L250 279 L300 279"/>
  <text class="lbl" x="308" y="1034" text-anchor="middle">YES</text>

  <path class="ln" d="M500 1094 L500 1130"/>
  <text class="lbl" x="540" y="1120" text-anchor="middle">NO</text>

  <rect class="end" x="300" y="1132" width="400" height="86"/>
  <text class="t" x="500" y="1162" text-anchor="middle" font-weight="700">Final statistics</text>
  <text class="ts" x="500" y="1186" text-anchor="middle">hits, misses, final cache contents</text>
  <text class="ts" x="500" y="1206" text-anchor="middle">working-set survival message</text>

  <text class="ts" x="500" y="1270" text-anchor="middle">Conceptual view of the exact algorithm in the published report</text>
</svg>
